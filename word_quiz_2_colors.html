  :root{
    --ink:#3D4450; --ink-soft:#8A93A0; --rule:#C9CFD8; --base:#5BC8CE;
    --ok:#1E9E5A; --panel:#F5F7FA;
    --font:'PretendardX',Pretendard,-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{min-height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);
    display:flex;align-items:flex-start;justify-content:center;padding:8px 14px 10px}
  .wrap{width:100%;max-width:704px;text-align:center}

  header{display:flex;align-items:baseline;margin-bottom:2px;height:22px}
  .count{margin-left:auto;font-size:14px;font-weight:600;color:var(--ink-soft);
    font-variant-numeric:tabular-nums}

  .dots{display:flex;gap:7px;justify-content:center;margin:6px 0 8px;height:8px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);transition:.25s}
  .dots i.on{background:var(--base);transform:scale(1.35)}
  .dots i.past{background:var(--ok)}

  .stage{height:118px;display:flex;align-items:center;justify-content:center}
  .stage svg{height:98px;width:auto}
  .pop{animation:pop .4s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

  .sound{display:flex;justify-content:center;margin:2px 0 6px}
  .sound button{display:inline-flex;align-items:center;gap:9px;font-family:var(--f);
    font-size:14px;font-weight:600;color:var(--ink);background:var(--panel);
    border:0;border-radius:999px;padding:8px 18px;cursor:pointer;transition:.16s}
  .sound button:hover{background:#E6EBF1}
  .sound button:active{transform:scale(.96)}
  .sound button.on{background:#E4F6EB;color:#1E9E5A}
  .sound svg{width:20px;height:20px}
  .slots{position:relative;height:34px;margin:20px auto 24px;max-width:520px}
  /* 4선 — Pretendard 실측 비율 (ascender .707em / x-height .530em / descender .210em) */
  .ln{position:absolute;left:0;right:0;height:0}
  .ln.t{top:0;border-top:1.5px solid #9AA3AF}
  .ln.m{top:6px;border-top:1.5px dashed #C9CFD8}
  .ln.b{top:24px;border-top:2.5px solid var(--base)}
  .ln.x{top:31px;border-top:1.5px solid #9AA3AF}
  .slotrow{position:absolute;left:0;right:0;top:-4px;display:flex;
    align-items:flex-start;justify-content:center;gap:4px}
  .slot{position:relative;width:40px;display:flex;align-items:flex-start;justify-content:center;
    font-family:'Andika',var(--font);
    font-size:34px;font-weight:400;line-height:1;color:var(--ink)}
  .slot.empty::after{content:'';position:absolute;left:4px;right:4px;top:14px;height:17px;
    border-radius:5px;background:#EAF4F5}
  .slot.fill{animation:drop .3s cubic-bezier(.3,1.3,.5,1)}
  @keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}

  .tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px}
  .tile{font-family:var(--font);font-size:23px;font-weight:600;width:48px;height:48px;
    border:0;border-radius:14px;background:var(--panel);color:var(--ink);
    cursor:pointer;transition:.16s}
  .tile:hover{background:#E6EBF1;transform:translateY(-2px)}
  .tile:active{transform:translateY(0)}
  .tile.used{opacity:.22;pointer-events:none}
  .tile.bad{animation:shake .38s;background:#FDEAEA}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
    40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  .msg{margin-top:8px;font-size:16px;font-weight:600;color:var(--ok);
    opacity:0;transition:.35s;min-height:22px}
  .msg.show{opacity:1}
  .again{margin-top:2px;height:32px;display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:.35s}
  .again.show{opacity:1;pointer-events:auto}
  .again button{font-family:var(--font);font-size:14px;font-weight:600;color:var(--ink);
    background:var(--panel);border:0;border-radius:999px;padding:8px 20px;cursor:pointer}
  .again button:hover{background:#E6EBF1}
  :focus-visible{outline:3px solid var(--base);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media(max-width:560px){
    .slot{width:32px;font-size:28px}.tile{width:42px;height:42px;font-size:20px}
    .slots{height:28px}.ln.m{top:8px}.ln.b{top:22px}.ln.x{top:28px}.slotrow{top:-3px}
    .slot.empty::after{top:11px;height:14px}
    .stage svg{height:86px}
  }
</style>
</head>
<body>

};
const EXTRA='abcdefghijklmnopqrstuvwxyz';
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

const stage=document.getElementById('stage'), slotsEl=document.getElementById('slots'),
      tilesEl=document.getElementById('tiles'), msg=document.getElementById('msg'),
      dots=document.getElementById('dots'), nEl=document.getElementById('n'),
      againWrap=document.getElementById('againWrap');
let ri=0, pos=0, player=null;

function play(){
  const w = ROUNDS[ri].w;
  if(!AUDIO[w]) return;
  try{
    if(player){ player.pause(); }
    player = new Audio(AUDIO[w]);
    const b = document.getElementById('say');
    b.classList.add('on');
    player.onended = () => b.classList.remove('on');
    player.play().catch(()=>b.classList.remove('on'));
  }catch(e){}
}

function renderDots(){
  dots.innerHTML=ROUNDS.map((_,i)=>
    `<i class="${i<ri?'past':i===ri?'on':''}"></i>`).join('');
}

function load(){
  const r=ROUNDS[ri]; pos=0;
  nEl.textContent=ri+1; renderDots();
  msg.classList.remove('show'); msg.textContent='';
  againWrap.classList.remove('show');

  stage.innerHTML=r.svg;
  stage.firstElementChild.classList.add('pop');

  slotsEl.innerHTML=[...r.w].map(()=>`<div class="slot empty"></div>`).join('');

  const need=[...r.w];
  const pool=shuffle([...EXTRA].filter(c=>!need.includes(c))).slice(0, r.w.length>5?2:3);
  tilesEl.innerHTML=shuffle([...need,...pool]).map(c=>
    `<button class="tile" data-c="${c}">${c}</button>`).join('');
  tilesEl.querySelectorAll('.tile').forEach(b=>b.onclick=()=>tap(b));
  document.getElementById('say').onclick = play;
}

function tap(btn){
  const r=ROUNDS[ri], want=r.w[pos];
  if(btn.dataset.c===want){
    const s=slotsEl.children[pos];
    s.textContent=want; s.classList.remove('empty'); s.classList.add('fill');
    btn.classList.add('used'); pos++;
    if(pos===r.w.length) finish();
  } else {
    btn.classList.add('bad');
    setTimeout(()=>btn.classList.remove('bad'),400);
  }
}

function finish(){
  if(ri<ROUNDS.length-1){
    msg.textContent='Nice!'; msg.classList.add('show');
    setTimeout(()=>{ ri++; load(); setTimeout(play, 260); },900);
  } else {
    renderDots();
    msg.textContent='You spelled all six words!';
    msg.classList.add('show'); againWrap.classList.add('show');
    dots.querySelectorAll('i').forEach(d=>{d.className='past'});
  }
}

document.getElementById('again').onclick=()=>{ri=0;load()};
load();
</script>
