  :root{
    --ink:#3D4450; --ink-soft:#8A93A0; --rule:#C9CFD8; --base:#5BC8CE;
    --spring:#EFA9C4; --summer:#1E9E5A; --fall:#C8232C; --winter:#3C4654;
    --ok:#1E9E5A; --no:#E5484D; --panel:#F5F7FA;
    --font:'PretendardX',Pretendard,-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);background:#fff;color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:920px;position:relative}

  header{display:flex;align-items:baseline;margin-bottom:20px}
  .count{margin-left:auto;font-size:15px;font-weight:600;color:var(--ink-soft);
    font-variant-numeric:tabular-nums}

  svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;position:relative;z-index:1}
  .row.words{margin-top:44px}

  .pic{background:var(--panel);border:2px solid transparent;border-radius:18px;
    padding:14px 10px 10px;cursor:pointer;transition:.18s;display:flex;
    align-items:center;justify-content:center;aspect-ratio:1/.92}
  .pic svg{width:100%;height:100%}
  .pic:hover{background:#EDF1F6}
  .pic.sel{border-color:var(--base);background:#fff;
    box-shadow:0 6px 20px rgba(91,200,206,.28)}
  .pic.done{opacity:.5;pointer-events:none}

  .word{cursor:pointer;padding:6px 8px 0;position:relative;transition:.18s}
  .word .lines{position:relative;height:74px}
  .ln{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--rule)}
  .ln.t{top:8px} .ln.m{top:37px;border-top-style:dashed}
  .ln.b{top:62px;border-top:2px solid var(--base)} .ln.x{top:74px}
  .word span{position:absolute;left:0;right:0;top:6px;height:60px;
    display:flex;align-items:flex-end;justify-content:center;
    font-size:32px;font-weight:500;letter-spacing:-.01em;line-height:1;
    padding-bottom:4px;color:var(--ink)}
  .word:hover span{color:#000}
  .word.done{pointer-events:none}
  .word.done span{color:var(--ok)}
  .word.bad{animation:shake .38s}
  @keyframes shake{0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}40%{transform:translateX(8px)}
    60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  .done-msg{margin-top:34px;text-align:center;font-size:19px;font-weight:600;
    color:var(--ok);opacity:0;transition:.4s;transform:translateY(6px)}
  .done-msg.show{opacity:1;transform:none}
  .again{margin-top:14px;display:flex;justify-content:center}
  .again button{font-family:var(--font);font-size:15px;font-weight:600;
    color:var(--ink);background:var(--panel);border:0;border-radius:999px;
    padding:11px 26px;cursor:pointer;transition:.18s}
  .again button:hover{background:#E6EBF1}
  .again{opacity:0;pointer-events:none;transition:.4s}
  .again.show{opacity:1;pointer-events:auto}
  :focus-visible{outline:3px solid var(--base);outline-offset:3px;border-radius:12px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media(max-width:640px){
    .row{gap:10px}.word span{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="count"><span id="n">0</span> / 4</div>
  </header>

  <svg class="wires" id="wires" preserveAspectRatio="none"></svg>
  <div class="row pics" id="pics"></div>
  <div class="row words" id="words"></div>

  <div class="done-msg" id="msg">You matched all four seasons!</div>
  <div class="again" id="againWrap"><button id="again">Play again</button></div>
</div>

    <circle cx="60" cy="34" r="20" fill="#2CB46B"/><circle cx="58" cy="54" r="18" fill="#3FC97E"/></svg>`,
  fall:`<svg viewBox="0 0 120 120"><ellipse cx="60" cy="106" rx="40" ry="7" fill="#F2D3CC"/>
    <path d="M57 106V62h6v44z" fill="#6B4536"/><path d="M60 74l-14-12 3-4 13 11zM60 70l13-11 3 4-14 11z" fill="#6B4536"/>
    <circle cx="42" cy="48" r="20" fill="#C8232C"/><circle cx="76" cy="46" r="22" fill="#E4632B"/>
    <circle cx="60" cy="34" r="20" fill="#D63A28"/><circle cx="58" cy="54" r="18" fill="#E4632B"/>
    <circle cx="26" cy="76" r="4" fill="#E4632B"/><circle cx="96" cy="70" r="4" fill="#C8232C"/></svg>`,
  winter:`<svg viewBox="0 0 120 120"><ellipse cx="60" cy="106" rx="40" ry="8" fill="#E4EEF4"/>
    <path d="M57 106V44h6v62z" fill="#3C4654"/>
    <path d="M60 62L38 44l3-4 20 16zM60 58l21-17 3 4-22 17zM60 46L46 32l3-3 12 12zM60 42l13-13 3 3-14 13z" fill="#3C4654"/>
    <circle cx="34" cy="34" r="3.5" fill="#B9D4E4"/><circle cx="88" cy="52" r="3" fill="#B9D4E4"/>
    <circle cx="78" cy="24" r="2.5" fill="#B9D4E4"/></svg>`
};
const KEYS = Object.keys(TREES);
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

const picsEl=document.getElementById('pics'), wordsEl=document.getElementById('words'),
      wires=document.getElementById('wires'), nEl=document.getElementById('n'),
      msg=document.getElementById('msg'), againWrap=document.getElementById('againWrap');
let sel=null, matched=0;

function build(){
  picsEl.innerHTML=''; wordsEl.innerHTML=''; wires.innerHTML='';
  sel=null; matched=0; nEl.textContent='0';
  msg.classList.remove('show'); againWrap.classList.remove('show');

  shuffle(KEYS).forEach(k=>{
    const d=document.createElement('div');
    d.className='pic'; d.dataset.k=k; d.tabIndex=0;
    d.setAttribute('role','button'); d.setAttribute('aria-label',k+' picture');
    d.innerHTML=TREES[k];
    const pick=()=>{ if(d.classList.contains('done'))return;
      document.querySelectorAll('.pic.sel').forEach(p=>p.classList.remove('sel'));
      d.classList.add('sel'); sel=d; };
    d.onclick=pick; d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}};
    picsEl.appendChild(d);
  });

  shuffle(KEYS).forEach(k=>{
    const d=document.createElement('div');
    d.className='word'; d.dataset.k=k; d.tabIndex=0;
    d.setAttribute('role','button'); d.setAttribute('aria-label',k);
    d.innerHTML=`<div class="lines"><i class="ln t"></i><i class="ln m"></i>
      <i class="ln b"></i><span>${k}</span></div>`;
    const pick=()=>{ if(!sel||d.classList.contains('done'))return; try_(d) };
    d.onclick=pick; d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}};
    wordsEl.appendChild(d);
  });
}

function try_(word){
  if(sel.dataset.k===word.dataset.k){
    sel.classList.add('done'); word.classList.add('done');
    drawWire(sel,word); sel.classList.remove('sel');
    sel=null; matched++; nEl.textContent=matched;
    if(matched===4){ msg.classList.add('show'); againWrap.classList.add('show'); }
  } else {
    word.classList.add('bad');
    setTimeout(()=>word.classList.remove('bad'),400);
  }
}

function drawWire(a,b){
  const box=document.querySelector('.wrap').getBoundingClientRect();
  const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
  const x1=ra.left-box.left+ra.width/2, y1=ra.bottom-box.top;
  const x2=rb.left-box.left+rb.width/2, y2=rb.top-box.top+10;
  const mid=(y1+y2)/2;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',`M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`);
  p.setAttribute('fill','none'); p.setAttribute('stroke','#5BC8CE');
  p.setAttribute('stroke-width','3'); p.setAttribute('stroke-linecap','round');
  const len=Math.hypot(x2-x1,y2-y1)+80;
  p.setAttribute('stroke-dasharray',len); p.setAttribute('stroke-dashoffset',len);
  wires.appendChild(p);
  p.animate([{strokeDashoffset:len},{strokeDashoffset:0}],
    {duration:420,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
}

document.getElementById('again').onclick=build;
window.addEventListener('resize',()=>{ if(matched) { wires.innerHTML='';
  const dp=[...document.querySelectorAll('.pic.done')], dw=[...document.querySelectorAll('.word.done')];
  dp.forEach(p=>{ const w=dw.find(x=>x.dataset.k===p.dataset.k); if(w) drawWire(p,w); }); }});
build();
</script>
