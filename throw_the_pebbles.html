  :root{
    --ink:#3D4450; --ink2:#6B7280; --ink3:#9AA3AF;
    --water:#BFE3EE; --water2:#9FD4E4; --grass:#CFE6D6;
    --bag:#C9A88A; --bag2:#B08F72; --stone:#A9B2BC; --stone2:#8C96A1;
    --ok:#1E9E5A;
    --f:'PretendardX',Pretendard,-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{min-height:100%}
  body{font-family:var(--f);background:#fff;color:var(--ink);
    display:flex;align-items:flex-start;justify-content:center;padding:8px 14px 10px}
  .wrap{width:100%;max-width:704px;position:relative}

  header{display:flex;align-items:center;gap:12px;margin-bottom:2px}
  .count{margin-left:auto;font-size:14px;font-weight:600;color:var(--ink3);
    font-variant-numeric:tabular-nums}

  /* 걱정 문장 */
  .worry{min-height:42px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:21px;font-weight:600;letter-spacing:-.015em;
    color:var(--ink);padding:0 12px;transition:.3s}
  .worry.dim{opacity:.25}
  .worry.ok{color:var(--ok);font-weight:700}

  .scene{position:relative;height:300px;margin-top:0}

  /* 물 */
  .river{position:absolute;left:0;right:0;bottom:0;height:132px;
    border-radius:26px 26px 18px 18px;overflow:hidden;
    background:linear-gradient(180deg,var(--water) 0%,var(--water2) 100%)}
  .river i{position:absolute;left:-10%;width:120%;height:3px;border-radius:2px;
    background:rgba(255,255,255,.65)}
  .bank{position:absolute;left:0;right:0;bottom:118px;height:28px;
    border-radius:20px 20px 0 0;background:var(--grass)}

  /* 주머니 */
  .bag{position:absolute;left:40px;bottom:132px;width:168px;height:136px;cursor:grab}
  .bag.light{cursor:default}
  .bag svg{width:100%;height:100%;overflow:visible}
  .pebble{cursor:grab;transition:transform .18s}
  .pebble:active{cursor:grabbing}
  .pebble.gone{opacity:0;pointer-events:none;transition:opacity .2s}

  /* 던져지는 돌 */
  .fly{position:absolute;width:34px;height:30px;border-radius:50% 50% 46% 46%;
    background:radial-gradient(circle at 34% 30%,var(--stone),var(--stone2));
    pointer-events:none;z-index:5}

  /* 물결 */
  .ring{position:absolute;border:3px solid rgba(255,255,255,.9);border-radius:50%;
    pointer-events:none;z-index:4}
  .splash{position:absolute;font-size:26px;font-weight:800;color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:none;z-index:6}

  .hintbar{font-size:13.5px;font-weight:500;color:var(--ink3);transition:.3s}
  .again{margin-top:4px;display:flex;justify-content:center;height:34px;align-items:center;
    opacity:0;pointer-events:none;transition:.4s}
  .again.show{opacity:1;pointer-events:auto}
  .again button{font-family:var(--f);font-size:14px;font-weight:600;color:var(--ink);
    background:#F5F7FA;border:0;border-radius:999px;padding:8px 20px;cursor:pointer}
  .again button:hover{background:#E6EBF1}
  :focus-visible{outline:3px solid #5BC8CE;outline-offset:3px;border-radius:10px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(max-width:600px){
    .worry{font-size:18px}.scene{height:252px}.bag{width:140px;height:114px;left:12px;bottom:110px}
    .river{height:112px}.bank{bottom:100px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="hintbar" id="hint">Drag a pebble into the water.</div>
    <div class="count"><span id="n">0</span> / 5</div></header>

  <div class="worry" id="worry"></div>

  <div class="scene" id="scene">
    <div class="bank"></div>
    <div class="river" id="river">
      <i style="bottom:104px"></i><i style="bottom:76px;opacity:.6"></i>
      <i style="bottom:48px;opacity:.4"></i><i style="bottom:20px;opacity:.25"></i>
    </div>
    <div class="bag" id="bag">
      <svg viewBox="0 0 210 170">
        <path d="M26 62 h158 l-14 96 a14 14 0 0 1 -14 12 H54 a14 14 0 0 1 -14 -12 z"
              fill="var(--bag)"/>
        <path d="M26 62 h158 l-4 26 H30 z" fill="var(--bag2)"/>
        <path d="M74 62 v-16 a31 31 0 0 1 62 0 v16" fill="none"
              stroke="var(--bag2)" stroke-width="11" stroke-linecap="round"/>
        <g id="stones"></g>
      </svg>
    </div>
  </div>

  <div class="again" id="againWrap"><button id="again">Play again</button></div>

let sfx = null;
function plop(){
  try{
    sfx = new Audio(PLOP);
    sfx.volume = 0.75;
    sfx.play().catch(()=>{});
  }catch(e){}
}

const WORRIES = [
  "What if it rains on the picnic?",
  "What if I forget my song?",
  "I'm scared of the dark.",
  "What if I lose my ball?",
  "What if nobody plays with me?"
];
const POS = [[62,112],[104,104],[146,112],[82,132],[126,132]];

const scene=document.getElementById('scene'), bagEl=document.getElementById('bag'),
      river=document.getElementById('river'), stones=document.getElementById('stones'),
      worry=document.getElementById('worry'), nEl=document.getElementById('n'),
      hint=document.getElementById('hint'),
      againWrap=document.getElementById('againWrap');
let left=0, thrown=0, dragging=null;

function build(){
  stones.innerHTML=''; thrown=0; left=WORRIES.length;
  nEl.textContent='0';
  againWrap.classList.remove('show');
  worry.classList.remove('ok');
  hint.textContent='Drag a pebble into the water.'; hint.style.opacity=1;
  bagEl.classList.remove('light');
  worry.classList.remove('dim');
  worry.textContent=WORRIES[0];

  POS.forEach((p,i)=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','pebble'); g.dataset.i=i;
    g.innerHTML=`<ellipse cx="${p[0]}" cy="${p[1]}" rx="19" ry="16" fill="#A9B2BC"/>
      <ellipse cx="${p[0]-5}" cy="${p[1]-5}" rx="7" ry="5" fill="#C3CAD2" opacity=".8"/>`;
    g.addEventListener('pointerdown', start);
    stones.appendChild(g);
  });
}

function start(e){
  const g=e.currentTarget;
  if(g.classList.contains('gone')) return;
  e.preventDefault();
  const r=scene.getBoundingClientRect();
  const fly=document.createElement('div');
  fly.className='fly';
  fly.style.left=(e.clientX-r.left-17)+'px';
  fly.style.top =(e.clientY-r.top -15)+'px';
  scene.appendChild(fly);
  g.classList.add('gone');
  dragging={g,fly,r};
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',end);
}

function move(e){
  if(!dragging) return;
  const {fly,r}=dragging;
  fly.style.left=(e.clientX-r.left-17)+'px';
  fly.style.top =(e.clientY-r.top -15)+'px';
}

function end(e){
  if(!dragging) return;
  window.removeEventListener('pointermove',move);
  window.removeEventListener('pointerup',end);
  const {g,fly,r}=dragging; dragging=null;
  const rr=river.getBoundingClientRect();
  const inWater = e.clientX>rr.left && e.clientX<rr.right &&
                  e.clientY>rr.top  && e.clientY<rr.bottom;
  if(inWater){
    plop();
    splash(e.clientX-r.left, e.clientY-r.top);
    fly.remove();
    thrown++; nEl.textContent=thrown;
    next();
  } else {
    // 물이 아니면 주머니로 되돌아간다
    fly.style.transition='left .28s cubic-bezier(.3,1,.5,1), top .28s cubic-bezier(.3,1,.5,1), opacity .28s';
    const br=bagEl.getBoundingClientRect();
    fly.style.left=(br.left-r.left+br.width/2-17)+'px';
    fly.style.top =(br.top -r.top +br.height*0.6)+'px';
    fly.style.opacity='0';
    setTimeout(()=>{ fly.remove(); g.classList.remove('gone'); },300);
  }
}

function splash(x,y){
  const s=document.createElement('div');
  s.className='splash'; s.textContent='Splash!';
  s.style.left=(x-44)+'px'; s.style.top=(y-46)+'px';
  scene.appendChild(s);
  s.animate([{opacity:0,transform:'translateY(6px) scale(.85)'},
             {opacity:1,transform:'translateY(-14px) scale(1)',offset:.35},
             {opacity:0,transform:'translateY(-34px) scale(1.05)'}],
            {duration:900,easing:'ease-out'}).onfinish=()=>s.remove();
  for(let k=0;k<3;k++){
    const ring=document.createElement('div');
    ring.className='ring';
    ring.style.left=x+'px'; ring.style.top=y+'px';
    ring.style.width='0px'; ring.style.height='0px';
    scene.appendChild(ring);
    const sz=70+k*34;
    ring.animate([{width:'0px',height:'0px',marginLeft:'0px',marginTop:'0px',opacity:.85},
                  {width:sz+'px',height:sz*0.4+'px',marginLeft:(-sz/2)+'px',
                   marginTop:(-sz*0.2)+'px',opacity:0}],
                 {duration:900+k*160,delay:k*90,easing:'ease-out'}).onfinish=()=>ring.remove();
  }
}

function next(){
  if(thrown<WORRIES.length){
    worry.classList.add('dim');
    setTimeout(()=>{ worry.textContent=WORRIES[thrown]; worry.classList.remove('dim'); },260);
  } else {
    worry.textContent='Your pockets are light now!';
    worry.classList.add('ok');
    bagEl.classList.add('light');
    bagEl.animate([{transform:'translateY(0)'},{transform:'translateY(-16px)'},
                   {transform:'translateY(0)'}],{duration:900,easing:'ease-in-out'});
    hint.style.opacity=0;
    againWrap.classList.add('show');
  }
}

document.getElementById('again').onclick=build;
build();
</script>
